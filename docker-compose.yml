services:

  postgres:
    image: postgres:16-alpine
    container_name: ninoedu-postgres
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ninoedu-network

  backend:
    build:
      context: ./backend
    container_name: ninoedu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
    ports:
      - "8080:8080"
    networks:
      - ninoedu-network

  nginx:
    build:
      context: .     
      dockerfile: nginx/Dockerfile
    container_name: ninoedu-nginx
    restart: unless-stopped
    ports:
      - "3100:80"
    networks:
      - ninoedu-network

volumes:
  postgres_data:

networks:
  ninoedu-network:
    driver: bridge